
<!-- Tells the browser that this document uses HTML5 -->
<!DOCTYPE html>

<!-- Root element of the HTML page -->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>College Management System</title>
        <style>
                *{
                    margin:0;
                    padding:0;
                    box-sizing:border-box;
                    font-family:'Poppins',sans-serif;
                }

            /* ==========================
               Body Styling
            =========================== */

            body{

                /* Official glossy body background */
                background:linear-gradient(180deg,#eef4ff 0%,#dde7ff 100%);

                /* Flexbox is used for easy alignment */
                display:flex;

                /* Center horizontally */
                justify-content:center;

                /* Center vertically */
                align-items:center;

                /* Body takes full screen height */
                min-height:100vh;

                /* Space around the container */
                padding:34px 20px;
                color:#12264b;
            }

        /* ==========================
           Main Form Container
        =========================== */

            .container{
                width:100%;
                max-width:860px;
                background:rgba(255,255,255,0.94);
                backdrop-filter:blur(26px);
                border-radius:34px;
                padding:36px;
                box-shadow:0 35px 90px rgba(49,82,164,0.12);
                color:#12264b;
                margin:0 auto;
                border:1px solid rgba(255,255,255,0.88);
            }

        /* Heading */

        .container h1{
            text-align:center;
            margin-bottom:10px;
            font-size:38px;
            color:#10264a;
        }

        .logo-wrap{
            display:flex;
            justify-content:center;
            margin-bottom:18px;
        }

        .logo-img{
            max-width:110px;
            height:auto;
            border-radius:18px;
            box-shadow:0 8px 20px rgba(0,0,0,0.15);
        }

        /* Paragraph */

        .container p{
            text-align:center;
            margin-bottom:28px;
            color:#4e637f;
            font-size:16px;
        }

        /* ==========================
           Form Layout
        =========================== */

        form{

            /* Grid layout */
            display:grid;

            /* Two equal columns */
            grid-template-columns:repeat(2,1fr);

            /* Gap between fields */
            gap:20px;
        }

        /* Each input box */

        .input-box{

            display:flex;

            /* Label on top, input below */
            flex-direction:column;
        }

        /* Labels */

        label{
            margin-bottom:10px;
            font-weight:600;
            color:#334166;
        }

        /* Inputs, Select, Textarea */

        input,
        select,
        textarea{

            width:100%;
            padding:16px 18px;

            border:1px solid rgba(79,93,149,0.14);

            border-radius:18px;

            outline:none;

            font-size:15px;
            background:#f9fbff;
            color:#1f2937;
            box-shadow:0 16px 32px rgba(79,93,149,0.06);
            transition:all 0.25s ease;
        }

        /* Textarea height */

        textarea{

            resize:none;

            height:100px;
        }

        /* Makes an element take full width */

        .full{

            grid-column:1/3;
        }

        /* Gender options */

        .gender{

            display:flex;

            gap:18px;

            margin-top:12px;
            flex-wrap:wrap;
        }

        .gender label{
            display:inline-flex;
            align-items:center;
            gap:8px;
            font-weight:500;
            color:#334166;
        }

        .gender input{
            width:auto;
            margin:0;
        }

        /* Register button */

        .btn{

            grid-column:1/3;

            text-align:center;
            margin-top:6px;
        }

        button{

            width:100%;
            max-width:280px;
            padding:16px 22px;

            background:linear-gradient(135deg,#4e6bff,#2f4bee);

            color:white;

            border:none;

            border-radius:32px;

            font-size:18px;

            cursor:pointer;

            transition:.25s ease;
            box-shadow:0 18px 40px rgba(78,106,255,0.18);
        }

        /* Hover effect */

        button:hover{

            background:linear-gradient(135deg,#5f7cff,#1e3dd2);

            transform:translateY(-3px);

            box-shadow:0 22px 48px rgba(78,106,255,0.24);
        }

        /* When user clicks input */

        input:focus,
        select:focus,
        textarea:focus{

            border:1px solid #4e6bff;
            box-shadow:0 0 0 6px rgba(78,106,255,0.14);
        }

        /* Responsive Design */

        @media (max-width:1024px) {
            .container{
                width:90%;
            }
        }

        @media (max-width:768px){
            body{
                align-items:flex-start;
                padding:18px;
            }

            .container{
                width:100%;
                padding:22px;
                margin-top:18px;
            }

            form{
                grid-template-columns:1fr;
            }

            .full{
                grid-column:1;
            }

            .btn{
                grid-column:1;
            }

            button{
                width:100%;
                max-width:100%;
            }
        }

        @media (max-width:480px) {
            .container{
                padding:18px;
                border-radius:18px;
            }

            .container h1{
                font-size:28px;
            }

            .container p{
                font-size:14px;
                margin-bottom:20px;
            }

            input,
            select,
            textarea{
                padding:14px;
                font-size:14px;
            }
        }

    </style>

</head>

<body>

<!-- Main Container -->

<div class="container">
        <div class="logo-wrap">
            <img class="logo-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWIp2sKpa1GfGyvc_WehXObOzR_o2DLa351DDpkjG5cQ&s" alt="College Logo">
        </div>
    <h1>College Management System</h1>

    <!-- Sub Heading -->
    <p>Student Registration Form</p>

    <!-- Form Starts -->
    <form>

        <!-- First Name -->
        <div class="input-box">
            <label>First Name</label>
            <input type="text" placeholder="Enter First Name">
        </div>

        <!-- Last Name -->
        <div class="input-box">
            <label>Last Name</label>
            <input type="text" placeholder="Enter Last Name">
        </div>

        <!-- Email -->
        <div class="input-box">
            <label>Email</label>
            <input type="email" placeholder="Enter Email">
        </div>

        <!-- Mobile -->
        <div class="input-box">
            <label>Mobile Number</label>
            <input type="tel" placeholder="Enter Mobile Number">
        </div>

        <!-- Password -->
        <div class="input-box">
            <label>Password</label>
            <input type="password" placeholder="Password">
        </div>

        <!-- Confirm Password -->
        <div class="input-box">
            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm Password">
        </div>

        <!-- Date -->
        <div class="input-box">
            <label>Date of Birth</label>
            <input id="dob" type="date">
        </div>

        <!-- Department -->
        <div class="input-box">
            <label>Department</label>

            <select>

                <option>Select Department</option>

                <option>Computer Science</option>

                <option>Information Technology</option>

                <option>Mechanical</option>

                <option>Electronics</option>

            </select>

        </div>

        <!-- Gender -->
        <div class="input-box full">

            <label>Gender</label>

            <div class="gender">

                <label><input type="radio" name="gender" value="male" checked> Male</label>

                <label><input type="radio" name="gender" value="female"> Female</label>

                <label><input type="radio" name="gender" value="other"> Other</label>

            </div>

        </div>

        <!-- Address -->
        <div class="input-box full">

            <label>Address</label>

            <textarea placeholder="Enter Address"></textarea>

        </div>

        <!-- Upload Photo -->
        <div class="input-box full">

            <label>Upload Photo</label>

            <input type="file">

        </div>

        <!-- Register Button -->
        <div class="btn">

            <button>Register Now</button>

        </div>

    </form>

</div>

<script>
  const dobInput = document.getElementById('dob');
  if (dobInput) {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    dobInput.value = `${yyyy}-${mm}-${dd}`;
  }
</script>

</body>
</html>
