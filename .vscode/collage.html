<!-- Tells the browser that this document uses HTML5 -->
<!DOCTYPE html>

<!-- Root element of the HTML page -->
<html lang="en">

<head>

    <!-- Supports all languages and symbols -->
    <meta charset="UTF-8">

    <!-- Makes the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Text shown in the browser tab -->
    <title>College Management System</title>

    <!-- Internal CSS starts here -->
    <style>

        /* ==========================
           Universal Selector (*)
           Applies styles to every element
        =========================== */

        *{
            /* Removes default outside spacing */
            margin:0;

            /* Removes default inside spacing */
            padding:0;

            /* Width and height include padding and border */
            box-sizing:border-box;

            /* Sets the font for the whole page */
            font-family:'Poppins',sans-serif;
        }

        /* ==========================
           Body Styling
        =========================== */

        body{

            /* Beautiful blue gradient background */
            background:linear-gradient(135deg,#4facfe,#00f2fe);

            /* Flexbox is used for easy alignment */
            display:flex;

            /* Center horizontally */
            justify-content:center;

            /* Center vertically */
            align-items:center;

            /* Body takes full screen height */
            min-height:100vh;

            /* Space around the container */
            padding:30px 20px;
        }

        /* ==========================
           Main Form Container
        =========================== */

        .container{

            /* Responsive box width */
            width:100%;
            max-width:820px;

            /* Transparent white color */
            background:rgba(255,255,255,0.22);

            /* Blur effect (Glassmorphism) */
            backdrop-filter:blur(14px);

            /* Rounded corners */
            border-radius:22px;

            /* Space inside container */
            padding:32px;

            /* Shadow around the box */
            box-shadow:0 18px 45px rgba(0,0,0,0.18);

            /* Text color */
            color:white;

            /* Center in body */
            margin:0 auto;
            border:1px solid rgba(255,255,255,0.35);
        }

        /* Heading */

        .container h1{

            text-align:center;

            margin-bottom:10px;

            font-size:35px;
        }

        /* Paragraph */

        .container p{

            text-align:center;

            margin-bottom:30px;
            color:rgba(255,255,255,0.88);
        }

        /* ==========================
           Form Layout
        =========================== */

        form{

            /* Grid layout */
            display:grid;

            /* Two equal columns */
            grid-template-columns:repeat(2,1fr);

            /* Gap between fields */
            gap:20px;
        }

        /* Each input box */

        .input-box{

            display:flex;

            /* Label on top, input below */
            flex-direction:column;
        }

        /* Labels */

        label{

            margin-bottom:8px;

            font-weight:bold;
        }

        /* Inputs, Select, Textarea */

        input,
        select,
        textarea{

            width:100%;
            padding:14px 16px;

            border:none;

            border-radius:14px;

            outline:none;

            font-size:15px;
            background:rgba(255,255,255,0.95);
            color:#1f2937;
            box-shadow:inset 0 0 0 1px rgba(15,23,42,0.08);
            transition:all 0.25s ease;
        }

        /* Textarea height */

        textarea{

            resize:none;

            height:90px;
        }

        /* Makes an element take full width */

        .full{

            grid-column:1/3;
        }

        /* Gender options */

        .gender{

            display:flex;

            gap:18px;

            margin-top:10px;
            flex-wrap:wrap;
        }

        .gender label{
            display:inline-flex;
            align-items:center;
            gap:8px;
            font-weight:500;
            color:#f8fafc;
        }

        .gender input{
            width:auto;
            margin:0;
        }

        /* Register button */

        .btn{

            grid-column:1/3;

            text-align:center;
            margin-top:8px;
        }

        button{

            width:100%;
            max-width:260px;
            padding:14px;

            background:linear-gradient(135deg,#ff8a00,#ff5722);

            color:white;

            border:none;

            border-radius:30px;

            font-size:18px;

            cursor:pointer;

            transition:.35s ease;
        }

        /* Hover effect */

        button:hover{

            background:#ff5722;

            transform:translateY(-5px);

            box-shadow:0 10px 20px rgba(0,0,0,.3);
        }

        /* When user clicks input */

        input:focus,
        select:focus,
        textarea:focus{

            border:2px solid orange;
        }

        /* Responsive Design */

        @media (max-width:1024px) {
            .container{
                width:90%;
            }
        }

        @media (max-width:768px){
            body{
                align-items:flex-start;
                padding:18px;
            }

            .container{
                width:100%;
                padding:22px;
                margin-top:18px;
            }

            form{
                grid-template-columns:1fr;
            }

            .full{
                grid-column:1;
            }

            .btn{
                grid-column:1;
            }

            button{
                width:100%;
                max-width:100%;
            }
        }

        @media (max-width:480px) {
            .container{
                padding:18px;
                border-radius:18px;
            }

            .container h1{
                font-size:28px;
            }

            .container p{
                font-size:14px;
                margin-bottom:20px;
            }

            input,
            select,
            textarea{
                padding:14px;
                font-size:14px;
            }
        }

    </style>

</head>

<body>

<!-- Main Container -->

<div class="container">

    <!-- Heading -->
    <h1>College Management System</h1>

    <!-- Sub Heading -->
    <p>Student Registration Form</p>

    <!-- Form Starts -->
    <form>

        <!-- First Name -->
        <div class="input-box">
            <label>First Name</label>
            <input type="text" placeholder="Enter First Name">
        </div>

        <!-- Last Name -->
        <div class="input-box">
            <label>Last Name</label>
            <input type="text" placeholder="Enter Last Name">
        </div>

        <!-- Email -->
        <div class="input-box">
            <label>Email</label>
            <input type="email" placeholder="Enter Email">
        </div>

        <!-- Mobile -->
        <div class="input-box">
            <label>Mobile Number</label>
            <input type="tel" placeholder="Enter Mobile Number">
        </div>

        <!-- Password -->
        <div class="input-box">
            <label>Password</label>
            <input type="password" placeholder="Password">
        </div>

        <!-- Confirm Password -->
        <div class="input-box">
            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm Password">
        </div>

        <!-- Date -->
        <div class="input-box">
            <label>Date of Birth</label>
            <input type="date">
        </div>

        <!-- Department -->
        <div class="input-box">
            <label>Department</label>

            <select>

                <option>Select Department</option>

                <option>Computer Science</option>

                <option>Information Technology</option>

                <option>Mechanical</option>

                <option>Electronics</option>

            </select>

        </div>

        <!-- Gender -->
        <div class="input-box full">

            <label>Gender</label>

            <div class="gender">

                <label><input type="radio" name="gender"> Male</label>

                <label><input type="radio" name="gender"> Female</label>

                <label><input type="radio" name="gender"> Other</label>

            </div>

        </div>

        <!-- Address -->
        <div class="input-box full">

            <label>Address</label>

            <textarea placeholder="Enter Address"></textarea>

        </div>

        <!-- Upload Photo -->
        <div class="input-box full">

            <label>Upload Photo</label>

            <input type="file">

        </div>

        <!-- Register Button -->
        <div class="btn">

            <button>Register Now</button>

        </div>

    </form>

</div>

</body>
</html>
