<!-- Tells the browser that this document uses HTML5 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Management System</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }
        body{
            background:linear-gradient(180deg,#eef4ff 0%,#dde7ff 100%);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:34px 20px;
            color:#12264b;
        }
        .container{
            width:100%;
            max-width:860px;
            background:rgba(255,255,255,0.94);
            border-radius:34px;
            padding:36px;
            box-shadow:0 35px 90px rgba(49,82,164,0.12);
            color:#12264b;
            border:1px solid rgba(255,255,255,0.88);
        }
        .container h1{
            text-align:center;
            margin-bottom:10px;
            font-size:38px;
            color:#10264a;
        }

        .logo-wrap{
            display:flex;
            justify-content:center;
            margin-bottom:18px;
        }

            .logo-img{
                max-width:120px;
                height:auto;
                border-radius:10px;
                box-shadow:0 14px 30px rgba(15,34,60,0.12);
                border:1px solid rgba(16,38,74,0.04);
        }
        .container p{
            text-align:center;
            margin-bottom:28px;
            color:#4e637f;
            font-size:16px;
        }
        form{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
        }
        .input-box{
            display:flex;
            flex-direction:column;
        }
        label{
            margin-bottom:10px;
            font-weight:600;
            color:#334166;
        }
        input,
        select,
        textarea{
            width:100%;
            padding:16px 18px;
            border:1px solid rgba(79,93,149,0.14);
            border-radius:18px;
            background:#f9fbff;
            outline:none;
            font-size:15px;
            color:#1f2937;
            box-shadow:0 16px 32px rgba(79,93,149,0.06);
            transition:all 0.25s ease;
        }

        /* Placeholder color */
        ::placeholder{ color:#94a3b8 }
        textarea{
            resize:none;
            height:100px;
        }
        .full{
            grid-column:1/3;
        }
        .gender{
            display:flex;
            gap:18px;
            margin-top:12px;
            flex-wrap:wrap;
        }
        .btn{
            grid-column:1/3;
            text-align:center;
            margin-top:6px;
        }
        button{
            width:100%;
            max-width:280px;
            padding:16px 22px;
            background:linear-gradient(135deg,#4e6bff,#2f4bee);
            color:white;
            border:none;
            border-radius:32px;
            font-size:18px;
            cursor:pointer;
            transition:.25s ease;
            box-shadow:0 18px 40px rgba(78,106,255,0.18);
        }
        button:hover{
            background:linear-gradient(135deg,#5f7cff,#1e3dd2);
            transform:translateY(-3px);
            box-shadow:0 22px 48px rgba(78,106,255,0.24);
        }
        input:focus,
        select:focus,
        textarea:focus{
            border:1px solid #4e6bff;
            box-shadow:0 0 0 6px rgba(78,106,255,0.14);
            outline:none;
        }
        @media(max-width:768px){
            body{
                align-items:flex-start;
                padding:18px;
            }
            .container{
                width:100%;
                padding:22px;
                margin-top:18px;
            }
            form{
                grid-template-columns:1fr;
            }
            .full,
            .btn{
                grid-column:1;
            }
            button{
                max-width:100%;
            }
        }
        @media(max-width:480px){
            .container{
                padding:18px;
                border-radius:18px;
            }
            .container h1{
                font-size:28px;
            }
            .container p{
                font-size:14px;
                margin-bottom:20px;
            }
            input,
            select,
            textarea{
                padding:14px;
                font-size:14px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo-wrap">
        <img class="logo-img" src="https://share.google/jksF1DfLDpclb272M" alt="College Logo">
    </div>
    <h1>College Management System</h1>
    <p>Student Registration Form</p>
    <form>
        <div class="input-box">
            <label>First Name</label>
            <input type="text" placeholder="Enter First Name">
        </div>
        <div class="input-box">
            <label>Last Name</label>
            <input type="text" placeholder="Enter Last Name">
        </div>
        <div class="input-box">
            <label>Email</label>
            <input type="email" placeholder="Enter Email">
        </div>
        <div class="input-box">
            <label>Mobile Number</label>
            <input type="tel" placeholder="Enter Mobile Number">
        </div>
        <div class="input-box">
            <label>Password</label>
            <input type="password" placeholder="Password">
        </div>
        <div class="input-box">
            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm Password">
        </div>
        <div class="input-box">
            <label>Date of Birth</label>
            <input type="date">
        </div>
        <div class="input-box">
            <label>Department</label>
            <select>
                <option>Select Department</option>
                <option>Computer Science</option>
                <option>Information Technology</option>
                <option>Mechanical</option>
                <option>Electronics</option>
            </select>
        </div>
        <div class="input-box full">
            <label>Gender</label>
            <div class="gender">
                <label><input type="radio" name="gender"> Male</label>
                <label><input type="radio" name="gender"> Female</label>
                <label><input type="radio" name="gender"> Other</label>
            </div>
        </div>
        <div class="input-box full">
            <label>Address</label>
            <textarea placeholder="Enter Address"></textarea>
        </div>
        <div class="input-box full">
            <label>Upload Photo</label>
            <input type="file">
        </div>
        <div class="btn">
            <button>Register Now</button>
        </div>
    </form>
</div>
</body>
</html>
