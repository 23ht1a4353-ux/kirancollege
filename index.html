<!-- Tells the browser that this document uses HTML5 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Management System</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }
        body{
            background:linear-gradient(180deg,#eef4ff 0%,#dde7ff 100%);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:34px 20px;
            color:#12264b;
        }
        .container{
            width:100%;
            max-width:860px;
            background:rgba(255,255,255,0.94);
            border-radius:34px;
            padding:36px;
            box-shadow:0 35px 90px rgba(49,82,164,0.12);
            color:#12264b;
            border:1px solid rgba(255,255,255,0.88);
        }
        .container h1{
            text-align:center;
            <style>
            /* Google Font */
            @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
                font-family:'Poppins',sans-serif;
            }

            body{
                min-height:100vh;
                display:flex;
                justify-content:center;
                align-items:center;
                padding:40px 20px;
                background:linear-gradient(135deg,#0f2a45,#1f4d7a,#4f83cc);
            }

            .container{

                width:100%;
                max-width:950px;

                background:rgba(255,255,255,.97);

                border-radius:25px;

                padding:45px;

                box-shadow:0 20px 50px rgba(0,0,0,.18);

                backdrop-filter:blur(10px);

            }

            .container h1{

                text-align:center;

                color:#0f2a45;

                font-size:2.2rem;

                font-weight:700;

                margin-bottom:10px;

            }

            .container p{

                text-align:center;

                color:#6c757d;

                margin-bottom:35px;

            }

            form{

                display:grid;

                grid-template-columns:repeat(2,1fr);

                gap:25px;

            }

            .input-box{

                display:flex;

                flex-direction:column;

            }

            label{

                font-size:15px;

                font-weight:600;

                margin-bottom:8px;

                color:#1b3552;

            }

            input,
            select,
            textarea{

                width:100%;

                padding:15px 18px;

                border:1px solid #d6dde8;

                border-radius:12px;

                font-size:15px;

                transition:.35s;

                background:#fff;

            }

            textarea{

                resize:none;

                height:110px;

            }

            input:focus,
            select:focus,
            textarea:focus{

                border-color:#1565c0;

                box-shadow:0 0 12px rgba(21,101,192,.25);

                transform:translateY(-2px);

                outline:none;

            }

            .full{

                grid-column:span 2;

            }

            .gender{

                display:flex;

                flex-wrap:wrap;

                gap:25px;

                padding-top:10px;

            }

            .gender label{

                display:flex;

                align-items:center;

                gap:8px;

                font-weight:500;

            }

            input[type=file]{

                padding:12px;

                background:#f8fbff;

            }

            .btn{

                grid-column:span 2;

                display:flex;

                justify-content:center;

                margin-top:10px;

            }

            button{

                width:250px;

                padding:15px;

                border:none;

                border-radius:50px;

                background:linear-gradient(135deg,#0f2a45,#1565c0);

                color:#fff;

                font-size:18px;

                font-weight:600;

                cursor:pointer;

                transition:.4s;

            }

            button:hover{

                transform:translateY(-5px);

                box-shadow:0 15px 30px rgba(21,101,192,.35);

            }

            button:active{

                transform:scale(.98);

            }

            /* logo helpers */
            .logo-wrap{display:flex;justify-content:center;margin-bottom:18px}
            .logo-img{max-width:120px;height:auto;border-radius:10px}

            /* ==========================
                  Tablet
            ========================== */

            @media (max-width:992px){

            .container{

                padding:35px;

            }

            .container h1{

                font-size:32px;

            }

            }

            /* ==========================
                  Mobile
            ========================== */

            @media (max-width:768px){

            body{

                padding:20px;

            }

            .container{

                padding:25px;

                border-radius:18px;

            }

            form{

                grid-template-columns:1fr;

                gap:18px;

            }

            .full{

                grid-column:span 1;

            }

            .btn{

                grid-column:span 1;

            }

            button{

                width:100%;

            }

            .gender{

                flex-direction:column;

                gap:12px;

            }

            .container h1{

                font-size:28px;

            }

            }

            /* ==========================
                Small Mobile
            ========================== */

            @media (max-width:480px){

            .container{

                padding:18px;

            }

            .container h1{

                font-size:24px;

            }

            .container p{

                font-size:14px;

            }

            label{

                font-size:14px;

            }

            input,

            select,

            textarea{

                font-size:14px;

                padding:13px;

            }

            button{

                font-size:16px;

                padding:14px;

            }

            }

            </style>
        <div class="input-box">
            <label>Password</label>
            <input type="password" placeholder="Password">
        </div>
        <div class="input-box">
            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm Password">
        </div>
        <div class="input-box">
            <label>Date of Birth</label>
            <input type="date">
        </div>
        <div class="input-box">
            <label>Department</label>
            <select>
                <option>Select Department</option>
                <option>Computer Science</option>
                <option>Information Technology</option>
                <option>Mechanical</option>
                <option>Electronics</option>
            </select>
        </div>
        <div class="input-box full">
            <label>Gender</label>
            <div class="gender">
                <label><input type="radio" name="gender"> Male</label>
                <label><input type="radio" name="gender"> Female</label>
                <label><input type="radio" name="gender"> Other</label>
            </div>
        </div>
        <div class="input-box full">
            <label>Address</label>
            <textarea placeholder="Enter Address"></textarea>
        </div>
        <div class="input-box full">
            <label>Upload Photo</label>
            <input type="file">
        </div>
        <div class="btn">
            <button>Register Now</button>
        </div>
    </form>
</div>
</body>
</html>
