<!-- Tells the browser that this document uses HTML5 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Management System</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }
        body{
            background:linear-gradient(135deg,#0f2a45,#1f4d7a);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:30px 20px;
        }
        .container{
            width:100%;
            max-width:820px;
            background:#f8fbff;
            border-radius:20px;
            padding:35px;
            box-shadow:0 20px 45px rgba(15,34,60,0.18);
            color:#1c2d42;
        }
        .container h1{
            text-align:center;
            margin-bottom:10px;
            font-size:35px;
            color:#0f2a45;
        }
        .container p{
            text-align:center;
            margin-bottom:30px;
            color:#486582;
        }
        form{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
        }
        .input-box{
            display:flex;
            flex-direction:column;
        }
        label{
            margin-bottom:8px;
            font-weight:bold;
        }
        input,
        select,
        textarea{
            width:100%;
            padding:14px;
            border:1px solid #dce7f4;
            border-radius:12px;
            background:#ffffff;
            outline:none;
            font-size:15px;
            color:#1c2d42;
        }
        textarea{
            resize:none;
            height:90px;
        }
        .full{
            grid-column:1/3;
        }
        .gender{
            display:flex;
            gap:20px;
            margin-top:10px;
        }
        .btn{
            grid-column:1/3;
            text-align:center;
        }
        button{
            width:100%;
            max-width:260px;
            padding:14px;
            background:#0f2a45;
            color:#ffffff;
            border:none;
            border-radius:30px;
            font-size:18px;
            cursor:pointer;
            transition:.35s ease;
        }
        button:hover{
            background:#1f4d7a;
            transform:translateY(-5px);
            box-shadow:0 10px 20px rgba(15,34,60,0.2);
        }
        input:focus,
        select:focus,
        textarea:focus{
            border:2px solid #1f4d7a;
            box-shadow:0 0 0 5px rgba(31,77,122,0.25);
            outline:none;
        }
        @media(max-width:768px){
            body{
                align-items:flex-start;
                padding:18px;
            }
            .container{
                width:100%;
                padding:22px;
                margin-top:18px;
            }
            form{
                grid-template-columns:1fr;
            }
            .full,
            .btn{
                grid-column:1;
            }
            button{
                max-width:100%;
            }
        }
        @media(max-width:480px){
            .container{
                padding:18px;
                border-radius:18px;
            }
            .container h1{
                font-size:28px;
            }
            .container p{
                font-size:14px;
                margin-bottom:20px;
            }
            input,
            select,
            textarea{
                padding:14px;
                font-size:14px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>College Management System</h1>
    <p>Student Registration Form</p>
    <form>
        <div class="input-box">
            <label>First Name</label>
            <input type="text" placeholder="Enter First Name">
        </div>
        <div class="input-box">
            <label>Last Name</label>
            <input type="text" placeholder="Enter Last Name">
        </div>
        <div class="input-box">
            <label>Email</label>
            <input type="email" placeholder="Enter Email">
        </div>
        <div class="input-box">
            <label>Mobile Number</label>
            <input type="tel" placeholder="Enter Mobile Number">
        </div>
        <div class="input-box">
            <label>Password</label>
            <input type="password" placeholder="Password">
        </div>
        <div class="input-box">
            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm Password">
        </div>
        <div class="input-box">
            <label>Date of Birth</label>
            <input type="date">
        </div>
        <div class="input-box">
            <label>Department</label>
            <select>
                <option>Select Department</option>
                <option>Computer Science</option>
                <option>Information Technology</option>
                <option>Mechanical</option>
                <option>Electronics</option>
            </select>
        </div>
        <div class="input-box full">
            <label>Gender</label>
            <div class="gender">
                <label><input type="radio" name="gender"> Male</label>
                <label><input type="radio" name="gender"> Female</label>
                <label><input type="radio" name="gender"> Other</label>
            </div>
        </div>
        <div class="input-box full">
            <label>Address</label>
            <textarea placeholder="Enter Address"></textarea>
        </div>
        <div class="input-box full">
            <label>Upload Photo</label>
            <input type="file">
        </div>
        <div class="btn">
            <button>Register Now</button>
        </div>
    </form>
</div>
</body>
</html>
