<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black & White Theme Switcher</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
        transition:0.4s;
    }

    body{
        background:rgb(14, 32, 169);
        color:rgb(4, 3, 3);
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .container{
        text-align:center;
    }

    h1{
        margin-bottom:20px;
    }

    p{
        margin-bottom:20px;
        font-size:18px;
    }

    button{
        padding:12px 25px;
        font-size:18px;
        border:none;
        border-radius:8px;
        cursor:pointer;
        background:black;
        color:rgb(175, 13, 13);
    }

    button:hover{
        transform:scale(1.05);
    }

    /* Dark Theme */
    .dark{
        background:rgb(208, 226, 6);
        color:rgb(72, 2, 2);
    }

    .dark button{
        background:rgb(195, 195, 219);
        color:rgb(0, 0, 1);
    }
</style>

</head>
<body>

<div class="container">
    <h1>Theme Switcher</h1>
    <p>Click the button to change the theme.</p>
    <button onclick="changeTheme()">🌙 Dark Mode</button>
</div>

<script>
    let darkMode = false;

    function changeTheme(){
        document.body.classList.toggle("dark");

        const btn = document.querySelector("button");

        if(!darkMode){
            btn.innerHTML = "☀️ Light Mode";
            darkMode = true;
        }else{
            btn.innerHTML = "🌙 Dark Mode";
            darkMode = false;
        }
    }
</script>

</body>
</html>
